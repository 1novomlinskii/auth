syntax = "proto3";

package auth.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/user/auth/pkg/authv1;authv1";

// =============================================================================
// AuthService
// =============================================================================
service AuthService {
  rpc Register(RegisterRequest) returns (AuthResponse);
  rpc Login(LoginRequest) returns (AuthResponse);
  rpc GetOAuth2URL(GetOAuth2URLRequest) returns (GetOAuth2URLResponse);
  rpc LoginOAuth2(LoginOAuth2Request) returns (AuthResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (AuthResponse);
  rpc Logout(LogoutRequest) returns (google.protobuf.Empty);
}

// =============================================================================
// UserService
// =============================================================================
service UserService {
  rpc GetUser(GetUserRequest) returns (User);
  rpc UpdateUser(UpdateUserRequest) returns (User);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
}

// =============================================================================
// TokenService
// =============================================================================
service TokenService {
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc IntrospectToken(IntrospectTokenRequest) returns (IntrospectTokenResponse);
}

// =============================================================================
// RoleService
// =============================================================================
service RoleService {
  rpc CreateRole(CreateRoleRequest) returns (Role);
  rpc GetRole(GetRoleRequest) returns (Role);
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc UpdateRole(UpdateRoleRequest) returns (Role);
  rpc DeleteRole(DeleteRoleRequest) returns (google.protobuf.Empty);
  rpc AssignRole(AssignRoleRequest) returns (google.protobuf.Empty);
  rpc RevokeRole(RevokeRoleRequest) returns (google.protobuf.Empty);
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);
  rpc GetUserRoles(GetUserRolesRequest) returns (GetUserRolesResponse);
}

// =============================================================================
// APIKeyService
// =============================================================================
service APIKeyService {
  rpc CreateAPIKey(CreateAPIKeyRequest) returns (CreateAPIKeyResponse);
  rpc ListAPIKeys(ListAPIKeysRequest) returns (ListAPIKeysResponse);
  rpc ValidateAPIKey(ValidateAPIKeyRequest) returns (ValidateAPIKeyResponse);
  rpc RevokeAPIKey(RevokeAPIKeyRequest) returns (google.protobuf.Empty);
}

// =============================================================================
// Request messages
// =============================================================================

message RegisterRequest {
  string login = 1;
  string email = 2;
  string password = 3;
  string display_name = 4;
  string locale = 5;
  string timezone = 6;
}

message LoginRequest {
  string login = 1;
  string password = 2;
}

message GetOAuth2URLRequest {
  string provider = 1;
  string redirect_uri = 2;
}

message GetOAuth2URLResponse {
  string url = 1;
  string state = 2;
}

message LoginOAuth2Request {
  string provider = 1;
  string code = 2;
  string redirect_uri = 3;
  string code_verifier = 4;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message LogoutRequest {
  string refresh_token = 1;
}

message GetUserRequest {
  string user_id = 1;
}

message UpdateUserRequest {
  string user_id = 1;
  string display_name = 2;
  string locale = 3;
  string timezone = 4;
}

message ListUsersRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool is_valid = 1;
  string user_id = 2;
  string tenant_id = 3;
  repeated string roles = 4;
}

message IntrospectTokenRequest {
  string token = 1;
}

message IntrospectTokenResponse {
  bool active = 1;
  string sub = 2;
  string tenant_id = 3;
  repeated string roles = 4;
  int64 exp = 5;
  int64 iat = 6;
  bool is_blacklisted = 7;
}

message CreateRoleRequest {
  string name = 1;
  repeated string permissions = 2;
  string description = 3;
}

message GetRoleRequest {
  string role_id = 1;
}

message ListRolesRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message UpdateRoleRequest {
  string role_id = 1;
  string name = 2;
  repeated string permissions = 3;
  string description = 4;
}

message DeleteRoleRequest {
  string role_id = 1;
}

message AssignRoleRequest {
  string user_id = 1;
  string role_id = 2;
}

message RevokeRoleRequest {
  string user_id = 1;
  string role_id = 2;
}

message CheckPermissionRequest {
  string user_id = 1;
  string permission = 2;
}

message CheckPermissionResponse {
  bool allowed = 1;
}

message GetUserRolesRequest {
  string user_id = 1;
}

message GetUserRolesResponse {
  repeated Role roles = 1;
}

message CreateAPIKeyRequest {
  string service_name = 1;
  repeated string permissions = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message CreateAPIKeyResponse {
  APIKey api_key = 1;
  string full_key = 2;
}

message ListAPIKeysRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListAPIKeysResponse {
  repeated APIKey api_keys = 1;
  int32 page = 2;
  int32 page_size = 3;
  int32 total = 4;
}

message ValidateAPIKeyRequest {
  string api_key = 1;
}

message ValidateAPIKeyResponse {
  bool is_valid = 1;
  string tenant_id = 2;
  string service_name = 3;
  repeated string permissions = 4;
}

message RevokeAPIKeyRequest {
  string api_key_id = 1;
}

// =============================================================================
// Response messages
// =============================================================================

message AuthResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
  string token_type = 4;
  User user = 5;
}

message ListUsersResponse {
  repeated User users = 1;
  int32 page = 2;
  int32 page_size = 3;
  int32 total = 4;
}

message ListRolesResponse {
  repeated Role roles = 1;
  int32 page = 2;
  int32 page_size = 3;
  int32 total = 4;
}

// =============================================================================
// Entity messages
// =============================================================================

message User {
  string user_id = 1;
  string tenant_id = 2;
  string login = 3;
  string display_name = 4;
  string email_primary = 5;
  string locale = 6;
  string timezone = 7;
  bool is_active = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message Role {
  string role_id = 1;
  string tenant_id = 2;
  string name = 3;
  repeated string permissions = 4;
  bool is_system = 5;
  string description = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message APIKey {
  string api_key_id = 1;
  string tenant_id = 2;
  string service_name = 3;
  string key_prefix = 4;
  repeated string permissions = 5;
  string created_by = 6;
  google.protobuf.Timestamp expires_at = 7;
  bool is_active = 8;
  google.protobuf.Timestamp created_at = 9;
}